[inputs]
include = ["src/**"]

[language]
# Module defaults apply to contained procedures. D-exponent literals are used
# throughout the library alongside named kinds.
implicit_scopes = ["module", "submodule"]
# NVIDIA Fortran 25.3 accepts IMPLICIT NONE for typing.
require_implicit_external = false
named_kinds = []

[compiler]
# Use the compiler flags selected by the CMake build.
gnu_flags = []
ifx_flags = []
ifx_windows_flags = []

[rules.STD002]
# The public API uses INTENT(OUT) for result arguments.
severity = "off"

[rules.OOP002]
# Clients read the data fields directly. Extensions initialize the base model
# parameters. Both are part of their Fortran type interfaces.
exclude_subjects = [
    "iapws::type_water_jacobian::*",
    "iapws::type_water_saturation::*",
    "iapws::type_water_state::*",
    "module_iapws::abst_iapws_gibbs::*",
    "module_iapws::abst_iapws_helmholtz::*",
    "module_iapws::type_iapws_gibbs_coefficient::*",
    "module_iapws::type_iapws_helmholtz_property::*",
    "module_iapws::type_iapws_property::*",
]

[[overrides]]
# Preserve the ice module's historical re-exports, including the intrinsic
# symbols provided by the selected compiler.
rules = ["OOP001", "C121"]
subjects = ["module_iapws06_iceih"]
paths = ["src/iapws06/iapws06_iceIh_interface.F90"]
severity = "off"

[rules.OOP005]
# These standalone procedures provide stateless numerical operations or construction.
exclude_subjects = [
    "iapws::melting_pressure",
    "iapws::new_water",
    "iapws::sublimation_pressure",
    "iapws::surface_tension",
    "iapws::thermal_conductivity",
    "iapws::viscosity",
    "module_iapws97_backward::backward_temperature",
    "module_iapws97_backward::polynomial",
    "module_iapws97_volume::volume_region3",
    "module_iapws_batch::batch_check_shapes",
    "module_iapws_batch::batch_gibbs_outputs",
    "module_iapws_batch::batch_invalid",
    "module_iapws_batch::batch_values_outputs",
    "module_supercooled_water::evaluate_supercooled",
    "module_supercooled_water::in_supercooled_domain",
    "module_water_phase_boundaries::ice_ih_melting_slope",
    "module_water_phase_boundaries::melting_pressure",
    "module_water_phase_boundaries::sublimation_pressure",
    "module_water_phase_boundaries::sublimation_slope",
    "module_water_transport::industrial_reference_slope",
    "module_water_transport::surface_tension",
    "module_water_transport::thermal_conductivity",
    "module_water_transport::viscosity",
]

[rules.OOP006]
# Existing callers can import these Ice Ih procedures directly.
exclude_subjects = [
    "module_iapws06_iceih::calc_dcp_dp_iapws06",
    "module_iapws06_iceih::calc_dcp_dt_iapws06",
    "module_iapws06_iceih::calc_gamma_iapws06",
    "module_iapws06_iceih::calc_gamma_iapws06_ih",
    "module_iapws06_iceih::calc_gamma_p_iapws06_ih",
    "module_iapws06_iceih::calc_gamma_pp_iapws06_ih",
    "module_iapws06_iceih::calc_gamma_t_iapws06_ih",
    "module_iapws06_iceih::calc_gamma_tp_iapws06_ih",
    "module_iapws06_iceih::calc_gamma_tt_iapws06_ih",
    "module_iapws06_iceih::initialize_type_iapws06",
]

