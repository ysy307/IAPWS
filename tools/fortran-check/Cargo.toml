[package]
name = "fortran-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Configurable static analysis for modern Fortran projects"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "=1.0.100"
clap = { version = "=4.5.53", features = ["derive"] }
globset = "=0.4.18"
rayon = "=1.11.0"
regex = "=1.12.2"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
shell-words = "=1.1.0"
tempfile = "=3.23.0"
toml = "=0.8.23"
tree-sitter = "=0.26.7"
tree-sitter-fortran = "=0.6.0"
walkdir = "=2.5.0"
