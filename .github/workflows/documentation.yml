name: Build documentation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: .github/workflows/documentation.yml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran-12 python3-dev graphviz

      - name: Install FORD
        run: |
          python -m pip install ford==7.0.13
          python -m pip check

      - name: Build developer documentation
        run: ford api-docs-ford-settings.md

      - name: Upload documentation
        uses: actions/upload-artifact@v6
        with:
          name: documentation
          path: ./docs/api-docs
          if-no-files-found: error
