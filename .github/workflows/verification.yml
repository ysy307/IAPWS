name: Verify numerical results

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gfortran:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        build: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install iapws==1.5.5
      - run: cmake --workflow --preset workflow-gnu-${{ matrix.build }}
